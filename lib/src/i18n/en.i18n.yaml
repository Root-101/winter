# Base locale: the parameter types are declared here ({value: int}), the other locales only need the text.
# After any change run `fvm dart run slang` and commit the generated messages*.g.dart.
# Quote the texts: `{value: int}` has a `: ` that YAML would read as a map.
# The texts don't include the field name: it's already in the `fieldName` of the violation.
errors:
  validations:
    # notNull()
    notNull: 'The field cannot be null'
    # notBlank(): empty or only whitespace
    notBlank: 'The field cannot be blank'
    # size(): the same text for Strings (length), Iterables and Maps (items)
    size:
      min: 'The minimum is {value: int}'
      max: 'The maximum is {value: int}'
    # min(): `inclusive` (>=, default) or `exclusive` (>)
    min:
      inclusive: 'The minimum is {value: num}'
      exclusive: 'The value must be greater than {value: num}'
    # max(): `inclusive` (<=, default) or `exclusive` (<)
    max:
      inclusive: 'The maximum is {value: num}'
      exclusive: 'The value must be less than {value: num}'
    # email()
    email: 'The value is not a valid email'
    # pattern()
    pattern: 'The value has an invalid format'
    # isEnum(): `values` is the list of allowed values, joined with ', '
    isEnum: 'The value must be one of: {values: String}'
    # notEmpty(): a list, set or map without elements (notBlank() is the one of Strings)
    notEmpty: 'The field cannot be empty'
    # oneOf(): `values` is the list of allowed values, joined with ', '
    oneOf: 'The value must be one of: {values: String}'
    # url()
    url: 'The value is not a valid URL'
    # uuid()
    uuid: 'The value is not a valid UUID'
    # positive(), negative(), positiveOrZero(), negativeOrZero()
    positive: 'The value must be greater than 0'
    negative: 'The value must be less than 0'
    positiveOrZero: 'The value must be 0 or greater'
    negativeOrZero: 'The value must be 0 or less'
    # past(), future(), pastOrPresent(), futureOrPresent() of a DateTime
    past: 'The date must be in the past'
    future: 'The date must be in the future'
    pastOrPresent: 'The date cannot be in the future'
    futureOrPresent: 'The date cannot be in the past'
