name: winter
description: A Spring-inspired backend framework for Dart on dart:io - routing, filters, DI, JSON mapping, validation, security and consistent errors.
version: 0.1.0
repository: https://github.com/Root-101/winter
issue_tracker: https://github.com/Root-101/winter/issues
documentation: https://github.com/Root-101/winter/tree/main/doc
topics:
  - server
  - http
  - backend
  - rest
  - api

# The self-signed certificate of localhost for the HTTPS tests: not a secret
false_secrets:
  - /test/fixtures/localhost_key.pem

environment:
  sdk: ^3.13.0

dependencies:

  #Utils
  collection: ^1.19.1

  #Parses Content-Type headers (media types, multipart boundaries)
  http_parser: ^4.1.2

  #i18n: typed translations generated from the YAML files in lib/src/i18n (`dart run slang`)
  slang: ^4.19.0
  #Imported by the code that slang generates
  intl: '>=0.18.1 <2.0.0'

dev_dependencies:
  http: ^1.6.0
  lints: ^6.1.0
  test: ^1.31.1
