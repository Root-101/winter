name: winter
description: This project is designed to create server side apps the simplest way possible, and reduce the learning curve in backend development.
version: 0.1.0
repository: https://github.com/Root-101/winter

environment:
  sdk: ^3.13.0

dependencies:
  shelf: ^1.4.2

  #Utils
  collection: ^1.19.1

  #For media type parsing
  http_parser: ^4.1.2

  #For the route keys
  crypto: ^3.0.7

  #i18n: typed translations generated from the ARB files in lib/src/i18n (`dart run slang`)
  slang: ^4.19.0
  #Imported by the code that slang generates
  intl: '>=0.18.1 <2.0.0'

dev_dependencies:
  http: ^1.6.0
  lints: ^6.1.0
  test: ^1.31.1
