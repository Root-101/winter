name: i18n_example
description: Responses in the language of the request (Accept-Language) with slang translations.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  winter:
    path: ../../
  #Typed translations generated from lib/i18n/*.i18n.yaml (`dart run slang`)
  slang: ^4.19.0
  #Imported by the code that slang generates
  intl: '>=0.18.1 <2.0.0'

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0
